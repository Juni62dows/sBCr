<style>
/* ================= ДИЗАЙН-СИСТЕМА ================= */
:root{
  --bg:#12100c; --bg2:#171410; --panel:#1b1712; --panel2:#201b14;
  --line:#2e2719; --line2:#3d3423;
  --brass:#e0a93e; --brass2:#f2c14e; --brass-dim:#8a6a2a;
  --ink:#ede5d2; --ink2:#a89a7e; --ink3:#6f6450;
  --ok:#7dc95e; --warn:#d9a441; --bad:#e05b4b;
  --human:#e0a93e; --elf:#8fbe6e; --darkelf:#8fa3ad; --orc:#c86b4a; --dwarf:#c9974a;
  --f-head:'Russo One','Noto Sans SC',sans-serif;
  --f-body:'IBM Plex Sans','Noto Sans SC',sans-serif;
  --f-mono:'JetBrains Mono','Noto Sans SC',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body);
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
  /* тонкая блочная сетка — дань уважения Minecraft */
  background-image:
    linear-gradient(rgba(237,229,210,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(237,229,210,.025) 1px, transparent 1px);
  background-size:34px 34px;
}
::selection{background:var(--brass);color:#12100c}
a{color:var(--brass);text-decoration:none}
a:hover{color:var(--brass2)}
img,canvas{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--f-mono)}
.kicker{
  font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--brass);display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.kicker::before{content:"";width:8px;height:8px;background:var(--brass);flex:none}
h1,h2,h3{font-family:var(--f-head);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.12}
.sec-h2{font-size:clamp(26px,4vw,40px);margin-bottom:12px}
.sec-d{color:var(--ink2);max-width:640px}
section.block{padding:72px 0;border-top:1px solid var(--line)}
.rev{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
.rev.in{opacity:1;transform:none}

/* ================= КНОПКИ (пиксельная тень вместо градиентов) ================= */
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:14px 22px;
  font-family:var(--f-head);font-size:14px;text-transform:uppercase;letter-spacing:.06em;
  border:1px solid var(--brass);background:var(--brass);color:#161006;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  box-shadow:4px 4px 0 rgba(0,0,0,.45);
}
.btn:hover{background:var(--brass2);color:#161006;transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.45)}
.btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,0,0,.45)}
.btn.ghost{background:transparent;color:var(--brass)}
.btn.ghost:hover{background:rgba(224,169,62,.08);color:var(--brass2)}
.btn.big{padding:16px 28px;font-size:15px}
.btn i{width:18px;height:18px}

/* ================= ШАПКА ================= */
header{
  position:sticky;top:0;z-index:50;background:rgba(18,16,12,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:28px;height:66px}
.logo{display:flex;align-items:center;gap:11px;color:var(--ink)}
.logo:hover{color:var(--ink)}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-family:var(--f-head);font-weight:400;font-size:18px;letter-spacing:.04em}
.logo b em{font-style:normal;color:var(--brass)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{
  color:var(--ink2);font-size:14px;font-weight:500;padding:8px 13px;border:1px solid transparent;
  text-transform:uppercase;letter-spacing:.05em;
}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--brass);border-color:var(--line2);background:var(--panel)}

/* переключатель языка */
.lang{position:relative;margin-left:8px}
.lang>button{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);
  color:var(--ink);padding:8px 12px;font-family:var(--f-mono);font-size:13px;
}
.lang>button:hover{border-color:var(--brass-dim)}
.lang-menu{
  position:absolute;right:0;top:calc(100% + 6px);min-width:150px;background:var(--panel2);
  border:1px solid var(--line2);display:none;z-index:60;box-shadow:6px 6px 0 rgba(0,0,0,.4);
}
.lang.open .lang-menu{display:block}
.lang-menu button{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;
  background:none;border:none;color:var(--ink2);padding:10px 14px;font-size:13px;
  font-family:var(--f-mono);text-align:left;
}
.lang-menu button:hover{background:rgba(224,169,62,.09);color:var(--ink)}
.lang-menu button.on{color:var(--brass)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line2);color:var(--ink);padding:9px 11px}
.burger i{width:20px;height:20px}

/* ================= ГЕРОЙ ================= */
.hero{padding:78px 0 64px;border-top:none}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(38px,5.6vw,64px);margin:14px 0 20px}
.hero h1 span{display:block}
.hero h1 .gold{color:var(--brass)}
.hero .sub{color:var(--ink2);font-size:17px;max-width:520px;margin-bottom:30px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero-note{font-family:var(--f-mono);font-size:12.5px;color:var(--ink3);margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 18px}
.hero-note b{color:var(--ink2);font-weight:600}
.badge{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  border:1px solid var(--line2);padding:7px 12px;background:var(--panel);
}
.badge .dot{width:7px;height:7px;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.bender-zone{position:relative;display:flex;justify-content:center}
#benderCv{width:min(340px,86vw);image-rendering:pixelated;cursor:pointer}
.quote{
  position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%) scale(.94);
  background:var(--panel2);border:1px solid var(--brass-dim);color:var(--ink);
  font-size:14px;padding:10px 16px;max-width:270px;width:max-content;opacity:0;
  pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:5px 5px 0 rgba(0,0,0,.4);
}
.quote.show{opacity:1;transform:translate(-50%,-108%) scale(1)}
.quote::after{
  content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);
  width:12px;height:12px;background:var(--panel2);border-right:1px solid var(--brass-dim);border-bottom:1px solid var(--brass-dim);
}
.hint{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3);text-align:center;margin-top:14px;letter-spacing:.1em;text-transform:uppercase}

/* строка фактов */
.facts{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
.facts-in{display:flex;flex-wrap:wrap}
.fact{flex:1 1 200px;padding:26px 26px;border-right:1px solid var(--line);min-width:180px}
.fact:last-child{border-right:none}
.fact b{font-family:var(--f-mono);font-size:clamp(26px,3vw,34px);color:var(--brass);display:block;line-height:1.1}
.fact span{color:var(--ink2);font-size:13.5px}

/* ================= РАСЫ ================= */
.races-grid{display:grid;grid-template-columns:.9fr 1.4fr;gap:52px;align-items:start;margin-top:38px}
.race-row{margin-bottom:22px}
.race-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.race-top i{width:20px;height:20px;color:var(--ink2);flex:none}
.race-top .nm{font-weight:600;font-size:15.5px}
.race-top .pc{margin-left:auto;font-family:var(--f-mono);font-size:17px;font-weight:700}
.race-bar{height:14px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.race-bar>span{position:absolute;inset:0;width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.live{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:8px}
.live .dot{width:7px;height:7px;background:var(--ok);animation:pulse 1.8s infinite}
.live.cached .dot{background:var(--warn)}

/* ================= ФИЧИ (список-манифест, без карточек) ================= */
.feat{border-top:1px solid var(--line)}
.feat-row{display:grid;grid-template-columns:90px 1fr 1.4fr 60px;gap:26px;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--line)}
.feat-row .no{font-family:var(--f-mono);color:var(--brass);font-size:15px}
.feat-row h3{font-size:20px}
.feat-row p{color:var(--ink2);font-size:15px}
.feat-row i{width:22px;height:22px;color:var(--ink3);justify-self:end}

/* ================= НОВОСТИ ================= */
.hn-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;margin-top:38px}
.hn-lead{border:1px solid var(--line2);background:var(--panel);padding:30px;display:flex;flex-direction:column;gap:14px}
.hn-lead h3{font-size:clamp(20px,2.4vw,27px)}
.hn-lead p{color:var(--ink2)}
.hn-side{display:flex;flex-direction:column}
.hn-item{padding:18px 0;border-bottom:1px solid var(--line)}
.hn-item:first-child{padding-top:0}
.hn-item h4{font-size:16.5px;font-weight:600;font-family:var(--f-body);margin:8px 0 4px}
.hn-item p{color:var(--ink2);font-size:14px}
.tag{
  display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;padding:4px 9px;border:1px solid var(--brass-dim);color:var(--brass);
}
.tag.t-update{border-color:#4a6a3a;color:#9cc77e}
.tag.t-event{border-color:#7a5a3a;color:#d9a86b}
.tag.t-raid{border-color:#8a4034;color:#e08a72}
.tag.t-trade{border-color:#3a5a6a;color:#8ab8cc}
.date{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.more{margin-top:22px;align-self:flex-start}

/* лента новостей (страница) */
.tl{margin-top:44px;position:relative}
.tl::before{content:"";position:absolute;left:118px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl-item{display:grid;grid-template-columns:96px 44px 1fr;gap:22px;padding:26px 0}
.tl-item .dt{font-family:var(--f-mono);font-size:13px;color:var(--ink3);padding-top:4px;text-align:right}
.tl-item .nd{position:relative}
.tl-item .nd::before{
  content:"";position:absolute;left:50%;top:10px;transform:translateX(-50%);
  width:9px;height:9px;background:var(--brass);box-shadow:0 0 0 4px var(--bg);
}
.tl-item .bx{border:1px solid var(--line);background:var(--panel);padding:22px 26px}
.tl-item h3{font-size:19px;margin:10px 0 8px;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:600}
.tl-item p{color:var(--ink2);font-size:15px}

/* ================= КЛАНЫ ================= */
.clan-top{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end;margin-bottom:36px}
.map-wrap{border:1px solid var(--line2);background:var(--panel);padding:16px;position:relative}
#mapCv{width:100%;image-rendering:pixelated;cursor:crosshair}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px}
.map-legend span{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.map-legend i.sw{width:10px;height:10px;flex:none}
.lastshift{font-family:var(--f-mono);font-size:12.5px;color:var(--ink3);margin-top:12px}
.lastshift b{color:var(--ink2)}
table.lb{width:100%;border-collapse:collapse;margin-top:8px}
.lb th{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:12px 14px;border-bottom:1px solid var(--line2);font-weight:400;
}
.lb td{padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.lb tr:hover td{background:rgba(224,169,62,.04)}
.lb .rk{font-family:var(--f-mono);color:var(--ink3);font-size:15px}
.lb tr:first-child .rk{color:var(--brass)}
.lb .cnm{font-family:var(--f-head);font-size:16px;letter-spacing:.03em}
.lb .ldr{color:var(--ink3);font-size:13px}
.lb .holds{color:var(--ink2);font-size:13.5px}
.lb .sw{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:baseline}
.lb .pts{font-family:var(--f-mono);font-weight:700;font-size:16px}
.lb .wk{font-family:var(--f-mono);font-size:12px;color:var(--ok)}
.lb .sc{font-family:var(--f-mono);font-size:13px;color:var(--ink3)}
tr.hl td{animation:rowhl 2s ease}
@keyframes rowhl{0%{background:rgba(224,169,62,.22)}100%{background:transparent}}

/* ================= СЕРВЕР ================= */
.mainstat{border:1px solid var(--line2);background:var(--panel);padding:28px 30px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 34px;margin:36px 0 20px}
.bigdot{width:16px;height:16px;background:var(--ok);border-radius:50%;position:relative;flex:none}
.bigdot::after{content:"";position:absolute;inset:-7px;border:1px solid var(--ok);border-radius:50%;animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
.bigdot.off{background:var(--bad)}
.bigdot.off::after{border-color:var(--bad)}
.mainstat .stt{font-family:var(--f-head);font-size:clamp(22px,3vw,30px);letter-spacing:.06em}
.mainstat .stt.ok{color:var(--ok)} .mainstat .stt.off{color:var(--bad)}
.mainstat .nm{color:var(--ink3);font-family:var(--f-mono);font-size:13px}
.netrow{display:flex;flex-wrap:wrap;gap:10px 30px;font-family:var(--f-mono);font-size:13px;color:var(--ink2);padding:0 30px 26px}
.netrow b{color:var(--ink)}
.srv-note{font-family:var(--f-mono);font-size:12px;color:var(--ink3);margin:6px 0 0}
.reg-h{
  font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);
  margin:34px 0 12px;display:flex;align-items:center;gap:12px;
}
.reg-h::after{content:"";flex:1;height:1px;background:var(--line)}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.node{background:var(--panel);padding:14px 16px}
.node .top{display:flex;align-items:center;gap:9px}
.node .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.node .nm2{font-weight:600;font-size:14.5px}
.node .st2{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ok);text-transform:uppercase}
.node .st2.off{color:var(--bad)}
.node .pg{display:flex;align-items:center;gap:10px;margin-top:9px}
.node .pv{font-family:var(--f-mono);font-size:13px;width:48px}
.node .pb{flex:1;height:5px;background:var(--panel2);position:relative}
.node .pb>span{position:absolute;left:0;top:0;bottom:0}

/* ================= СКАЧАТЬ ================= */
.dl-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:48px;align-items:start;margin-top:38px}
.plat{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.plat:first-child{border-top:1px solid var(--line)}
.plat .ic{width:46px;height:46px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink2)}
.plat h3{font-family:var(--f-body);text-transform:none;font-size:17px;font-weight:600;letter-spacing:0}
.plat .ft{font-family:var(--f-mono);font-size:12px;color:var(--ink3);margin-top:2px}
.btn.sm{padding:10px 16px;font-size:12.5px;box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.regbox{border:1px solid var(--brass-dim);background:var(--panel);padding:28px}
.regbox h3{font-size:20px;margin-bottom:10px}
.regbox p{color:var(--ink2);font-size:14.5px;margin-bottom:20px}
.req{margin-top:26px}
.req h4{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.req li{list-style:none;color:var(--ink2);font-size:14px;padding:7px 0 7px 20px;position:relative;border-bottom:1px dashed var(--line)}
.req li::before{content:"";position:absolute;left:0;top:14px;width:8px;height:8px;background:var(--brass-dim)}
.faq{margin-top:14px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{
  list-style:none;cursor:pointer;padding:18px 0;font-weight:600;font-size:16px;
  display:flex;align-items:center;gap:14px;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"+";font-family:var(--f-mono);color:var(--brass);font-size:20px;width:18px;flex:none}
.faq details[open] summary::before{content:"–"}
.faq .a{color:var(--ink2);padding:0 0 18px 32px;font-size:15px;max-width:720px}

/* ================= CTA ================= */
.cta{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2);padding:56px 0}
.cta-in{display:flex;flex-wrap:wrap;align-items:center;gap:26px;justify-content:space-between}
.cta h2{font-size:clamp(22px,3.2vw,32px);max-width:640px}
.cta h2 em{font-style:normal;color:var(--brass)}
.cta-btns{display:flex;gap:14px;flex-wrap:wrap}

/* ================= ПОДВАЛ ================= */
footer{padding:56px 0 34px}
.ft-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;padding-bottom:40px;border-bottom:1px solid var(--line)}
.ft-grid h5{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px;font-weight:400}
.ft-grid a{display:block;color:var(--ink2);font-size:14px;padding:4px 0}
.ft-grid a:hover{color:var(--brass)}
.ft-brand p{color:var(--ink3);font-size:13.5px;max-width:280px;margin-top:12px}
.soc{display:flex;gap:10px;margin-top:18px}
.soc a{
  width:40px;height:40px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:16px;
}
.soc a:hover{border-color:var(--brass);color:var(--brass)}
.ft-bot{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:space-between;padding-top:24px;color:var(--ink3);font-size:12.5px;font-family:var(--f-mono)}

/* ================= ПРОЧЕЕ ================= */
#tip{
  position:fixed;z-index:99;background:var(--panel2);border:1px solid var(--brass-dim);
  padding:8px 12px;font-size:13px;pointer-events:none;display:none;max-width:240px;
  box-shadow:4px 4px 0 rgba(0,0,0,.4);
}
#tip b{color:var(--brass)}
#tip .tt2{color:var(--ink2);font-size:12px}
.page{display:none}
.page.on{display:block}
.bread{font-family:var(--f-mono);font-size:12px;color:var(--ink3);margin-bottom:26px;display:flex;gap:8px}
.bread a{color:var(--ink3)}

@media(max-width:960px){
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .bender-zone{order:-1}
  .races-grid,.hn-grid,.dl-grid,.clan-top{grid-template-columns:1fr;gap:34px}
  .feat-row{grid-template-columns:50px 1fr;grid-template-rows:auto auto}
  .feat-row p{grid-column:2}
  .feat-row i{display:none}
  nav.main{display:none}
  nav.main.open{
    display:flex;position:absolute;top:66px;left:0;right:0;flex-direction:column;
    background:var(--panel2);border-bottom:1px solid var(--line2);padding:12px 18px;gap:2px;
  }
  .burger{display:block}
  .hd{gap:14px}
  .tl::before{left:10px}
  .tl-item{grid-template-columns:26px 1fr;grid-template-rows:auto auto}
  .tl-item .dt{grid-column:2;text-align:left;padding-top:0}
  .tl-item .nd{grid-row:1/3}
  .lb th:nth-child(5),.lb td:nth-child(5){display:none}
}
@media(max-width:560px){

  .plat{grid-template-columns:44px 1fr;grid-template-rows:auto auto}
  .plat .btn{grid-column:1/3;justify-content:center}
}
</style>

function detectLang(){
  const url = new URLSearchParams(location.search).get('lang');
  if (url && I18N[url]) return url;
  const saved = localStorage.getItem('bc_lang');
  if (saved && I18N[saved]) return saved;
  const nav = (navigator.language||'en').toLowerCase();
  if (nav.startsWith('ru')) return 'ru';
  if (nav.startsWith('pl')) return 'pl';
  if (nav.startsWith('id')) return 'id';
  if (nav.startsWith('fr')) return 'fr';
  if (nav.startsWith('zh')) return 'zh';
  return 'en';
}
function setLang(code, silent){
  state.lang = code; localStorage.setItem('bc_lang', code);
  document.documentElement.lang = code==='zh' ? 'zh-CN' : code;
  document.getElementById('langCur').textContent = LANGS.find(l=>l.code===code).cur;
  applyI18n(); renderAll(); updateSEO();
  renderLangMenu();
  if (!silent) history.replaceState(null,'', location.pathname + '?lang=' + code + location.hash);
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = t(el.dataset.i18n);
    if (v !== el.dataset.i18n) el.innerHTML = v; // строки из словаря — доверенные
  });
  document.querySelectorAll('.yrs').forEach(el=> el.textContent = new Date().getFullYear()-2012);
}
function renderLangMenu(){
  const m = document.getElementById('langMenu');
  m.innerHTML = LANGS.map(l=>
    `<button role="option" aria-selected="${l.code===state.lang}" class="${l.code===state.lang?'on':''}" data-lc="${l.code}"><span>${l.label}</span><span>${l.cur}</span></button>`).join('');
  m.querySelectorAll('button').forEach(b=> b.addEventListener('click',()=>{ setLang(b.dataset.lc); document.getElementById('langBox').classList.remove('open'); }));
}

function router(){
  let h = location.hash.replace(/^#\/?/,'').split('?')[0];

const PAL = {A:'#e8a33d',a:'#5a6166',M:'#a6b0b4',m:'#78838a',d:'#4e585e',E:'#14181b',e:'#f2efe4',
  b:'#3a4247',S:'#181c1f',t:'#5e6a70',R:'#2e363b',C:'#8a5a2e',c:'#b07a3e',F:'#ff8a3c',P:'#8c979d',p:'#59636a',G:'#3f484e'};
function buildBender(){
  const W=32,H=35, g=Array.from({length:H},()=>Array(W).fill('.'));
  const px=(x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<H) g[y][x]=c; };
  const rect=(x1,y1,x2,y2,c)=>{ for(let y=y1;y<=y2;y++) for(let x=x1;x<=x2;x++) px(x,y,c); };
  // антенна
  rect(15,0,16,1,'A'); rect(15,2,16,4,'a');
  // крышка черепа
  rect(8,5,23,5,'m'); rect(6,6,25,6,'m'); rect(5,7,26,7,'m');
  // корпус головы
  rect(4,8,27,22,'m');
  for(let y=8;y<=22;y++){ px(4,y,'m'); px(5,y,'M'); px(6,y,'M'); px(7,y,'M'); px(25,y,'d'); px(26,y,'d'); px(27,y,'d'); }
  px(4,5,'m'); // стык
  // брови
  rect(8,9,14,9,'b'); rect(17,9,23,9,'b');
  // глаза
  rect(9,10,13,10,'E'); rect(8,11,14,15,'E'); rect(9,16,13,16,'E');
  rect(18,10,22,10,'E'); rect(17,11,23,15,'E'); rect(18,16,22,16,'E');
  rect(9,11,10,12,'e'); rect(18,11,19,12,'e');
  // рот с зубами
  rect(8,19,23,21,'S');
  [9,11,13,15,17,19,21].forEach(x=>px(x,20,'t'));
  px(8,19,'m'); px(23,19,'m'); px(8,21,'m'); px(23,21,'m');
  // заклёпки
  px(5,12,'R'); px(5,18,'R'); px(26,12,'R'); px(26,18,'R');
  // сигара
  rect(24,19,28,19,'c'); rect(24,20,28,20,'C'); rect(29,19,30,20,'F');
  // нижняя грань + шея
  rect(4,22,27,22,'d'); rect(13,23,18,24,'G');
  // плечи
  rect(9,25,22,25,'p'); rect(7,26,24,26,'P'); rect(5,27,26,27,'P'); rect(3,28,28,28,'P'); rect(2,29,29,30,'P');
  for(let y=25;y<=30;y++){ px(2,y,'p'); px(3,y,'p'); px(28,y,'p'); px(29,y,'p'); }
  px(7,26,'p'); px(24,26,'p'); px(5,27,'p'); px(26,27,'p');
  px(9,27,'R'); px(22,27,'R'); px(6,29,'R'); px(25,29,'R');
  return {grid:g,W,H};
}
let bender=null, blink=false, smoke=[], quoteTimer=null, blinkTimer=null;
function drawBender(ts){
  const cv=document.getElementById('benderCv'); if(!cv||!bender) return;
  const ctx=cv.getContext('2d'), cell=9;
  ctx.clearRect(0,0,cv.width,cv.height);
  const {grid,W,H}=bender;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let ch=grid[y][x]; if(ch==='.') continue;
    // моргание: закрываем глаза металлом
    if(blink && (ch==='E'||ch==='e') && y>=10&&y<=16){ ctx.fillStyle=PAL.m; }
    else ctx.fillStyle=PAL[ch];
    ctx.fillRect(x*cell,y*cell,cell,cell);
  }
  if(blink){ ctx.fillStyle=PAL.d; ctx.fillRect(8*cell,13*cell,7*cell,2); ctx.fillRect(17*cell,13*cell,7*cell,2); }
  // пульс антенны — «онлайн»
  const glow=.45+.4*Math.sin(ts/480);
  ctx.fillStyle=`rgba(255,201,100,${glow})`; ctx.fillRect(14*cell,0,4*cell,2*cell);
  ctx.fillStyle=`rgba(255,201,100,${glow*.5})`; ctx.fillRect(13*cell,-1,6*cell,4*cell);
  // тление сигары
  const em=.7+.3*Math.sin(ts/130);
  ctx.fillStyle=`rgba(255,138,60,${em})`; ctx.fillRect(29*cell,19*cell,2*cell,2*cell);
  // дым
  smoke=smoke.filter(p=>p.life>0);
  smoke.forEach(p=>{
    p.x+=p.vx+Math.sin(ts/300+p.ph)*.12; p.y+=p.vy; p.life-=.012;
    ctx.fillStyle=`rgba(170,175,180,${Math.max(p.life,0)*.55})`;
    ctx.fillRect(Math.round(p.x)*cell,Math.round(p.y)*cell,p.s,p.s);
  });
  requestAnimationFrame(drawBender);
}
function puff(n){
  for(let i=0;i<n;i++) smoke.push({x:29.5+(Math.random()*2-1),y:18.5-Math.random(),vx:(Math.random()-.4)*.05,vy:-(.06+Math.random()*.08),life:.7+Math.random()*.3,s:3+Math.random()*4|0,ph:Math.random()*6});
}

async function fetchJSON(url,timeout=8000){
  const ctl=new AbortController(); const id=setTimeout(()=>ctl.abort(),timeout);
  try{ const r=await fetch(url,{signal:ctl.signal}); clearTimeout(id); if(!r.ok) throw 0; return await r.json(); }
  finally{ clearTimeout(id); }
}

  catch(e){ racesData=FALLBACK_RACES; cached=true; }

async function loadVds(){
  let cached=false;
  try{ vdsData=await fetchJSON('https://api-reproxy.dalam.world/checkvds'); if(!vdsData||!vdsData.locations) throw 0; }
  catch(e){ vdsData=FALLBACK_VDS; cached=true; }
  document.getElementById('srvLiveTxt').textContent=t(cached?'srv.cached':'races.live');

function renderRaces(){
  const box=document.getElementById('racesList'); if(!box||!racesData) return;
  box.innerHTML=RACE_META.map(r=>{
    const v=racesData[r.key]??0;
    return `<div class="race-row">
      <div class="race-top"><i data-lucide="${r.icon}"></i><span class="nm">${t('race.'+r.key)}</span>

      <div class="race-bar"><span style="background:var(${r.css})" data-w="${v}"></span></div>

function pingColor(ms){ return ms<=10?'var(--ok)':ms<=15?'var(--warn)':'var(--bad)'; }
function renderServer(){
  if(!vdsData) return;
  const d=vdsData;
  const online=d.server_status==='online';
  const dot=document.getElementById('bigDot'); dot.classList.toggle('off',!online);
  const st=document.getElementById('bigStatus');
  st.textContent=t(online?'srv.online':'srv.offline'); st.className='stt '+(online?'ok':'off');
  document.getElementById('srvName').textContent=d.server_name||'';
  const locs=d.locations||[];
  const pings=locs.map(l=>parseInt(l.ping)||0);
  const avg=pings.length?Math.round(pings.reduce((a,b)=>a+b,0)/pings.length):0;
  document.getElementById('nTotal').textContent=locs.length;
  document.getElementById('nOnline').textContent=locs.filter(l=>l.status==='online').length;
  document.getElementById('nPing').textContent=avg+' ms';
  const best=pings.length?Math.min(...pings):0;
  document.getElementById('nBest').textContent=(locs[pings.indexOf(best)]?.node||'–')+' · '+best+' ms';
  document.getElementById('srvUpd').textContent=t('srv.updated')+': '+
    new Date(d.timestamp||Date.now()).toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'});
  // группировка по регионам
  const groups={};
  locs.forEach(l=>{ (groups[l.region]=groups[l.region]||[]).push(l); });
  document.getElementById('nodesOut').innerHTML=REGIONS_ORDER
    .filter(r=>groups[r])
    .map(r=>`<p class="reg-h">${r}</p><div class="nodes">`+groups[r].map(l=>{
      const ms=parseInt(l.ping)||0, on=l.status==='online';
      return `<div class="node"><div class="top">
        <span class="sdot" style="background:${on?'var(--ok)':'var(--bad)'}"></span>
        <span class="nm2">${l.node}</span>
        <span class="st2 ${on?'':'off'}">${on?t('srv.online'):t('srv.offline')}</span></div>
        <div class="pg"><span class="pv" style="color:${pingColor(ms)}">${l.ping}</span>
        <span class="pb"><span style="width:${Math.min(ms/30*100,100)}%;background:${pingColor(ms)}"></span></span></div>
      </div>`;
    }).join('')+`</div>`).join('');
}

/* ---------- 8. КЛАНЫ: карта + таблица ---------- */
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let z=Math.imul(seed^seed>>>15,1|seed); z=z+Math.imul(z^z>>>7,61|z)^z; return ((z^z>>>14)>>>0)/4294967296; }; }
function buildTerrain(cols,rows){
  const rnd=mulberry(20120921), T=[];
  for(let y=0;y<rows;y++){ T.push([]);
    for(let x=0;x<cols;x++){
      const edge = x<1.6||x>cols-2.6||y<1||y>rows-2;
      if (edge && rnd()<.85) { T[y].push('water'); continue; }
      const mountains = (x>cols*.62&&x<cols*.8&&y<rows*.42) || (x>cols*.34&&x<cols*.44&&y>rows*.55&&y<rows*.8);
      const forest = rnd()<.18 || (x>cols*.3&&x<cols*.5&&y>rows*.1&&y<rows*.35&&rnd()<.5);
      T[y].push(mountains&&rnd()<.8?'rock':forest?'forest':'plain');
    }
  } return T;
}
let mapState=null;
function drawMap(hover){
  const cv=document.getElementById('mapCv'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const {cols,rows,cell,terr}=mapState;
  cv.width=cols*cell; cv.height=rows*cell;
  const COL={water:'#1b2530',forest:'#22301e',rock:'#3a3a38',plain:'#2a261c'};
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    ctx.fillStyle=COL[terr[y][x]]; ctx.fillRect(x*cell,y*cell,cell,cell);
    if(terr[y][x]==='rock'){ ctx.fillStyle='#4a4a46'; ctx.fillRect(x*cell+cell*.3,y*cell,cell*.4,cell*.5); }
    if(terr[y][x]==='forest'){ ctx.fillStyle='#2f4426'; ctx.fillRect(x*cell+cell*.2,y*cell+cell*.3,cell*.6,cell*.5); }
  }
  CASTLES.forEach(c=>{
    ctx.fillStyle=CLANS[c.c].color; ctx.fillRect(c.x*cell-2,c.y*cell-2,cell+4,cell+4);
    ctx.fillStyle='#12100c'; // зубцы башни
    ctx.fillRect(c.x*cell+1,c.y*cell+2,cell-2,cell-5);
    ctx.fillStyle=CLANS[c.c].color; ctx.fillRect(c.x*cell+3,c.y*cell+cell-4,cell-6,2);
    if(hover&&hover.x===c.x&&hover.y===c.y){ ctx.strokeStyle='#f2efe4'; ctx.lineWidth=2; ctx.strokeRect(c.x*cell-4,c.y*cell-4,cell+8,cell+8); }
  });
}
function initMap(){
  const cv=document.getElementById('mapCv'); if(!cv) return;
  const cols=22,rows=10,cssW=cv.parentElement.clientWidth-32||600;
  const cell=Math.max(Math.floor(cssW/cols),14);
  mapState={cols,rows,cell,terr:buildTerrain(cols,rows)};
  cv.style.height=(rows*cell)+'px';
  drawMap();
  const tip=document.getElementById('tip');
  cv.addEventListener('mousemove',e=>{
    const r=cv.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/(r.width/cols)), y=Math.floor((e.clientY-r.top)/(r.height/rows));
    drawMap({x,y});
    const c=CASTLES.find(c=>c.x===x&&c.y===y);
    if(c){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
      tip.innerHTML=`<b>${c.nm}</b> · ${t('terr.castle')}<div class="tt2"><span class="sw" style="background:${CLANS[c.c].color};display:inline-block;width:9px;height:9px"></span> ${CLANS[c.c].name} — ${CLANS[c.c].leader}</div>`;
    } else if(terr[y]&&terr[y][x]){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
      tip.innerHTML=`<span class="tt2">${t('terr.'+terr[y][x])}</span>`;
    } else tip.style.display='none';
  });
  cv.addEventListener('mouseleave',()=>{ tip.style.display='none'; drawMap(); });
  cv.addEventListener('click',e=>{
    const r=cv.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/(r.width/cols)), y=Math.floor((e.clientY-r.top)/(r.height/rows));
    const c=CASTLES.find(c=>c.x===x&&c.y===y);
    if(!c) return;
    const sorted=[...CLANS].sort((a,b)=>b.pts-a.pts);
    const rank=sorted.indexOf(CLANS[c.c]);
    const row=document.querySelectorAll('#lbTable tbody tr')[rank];
    if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.classList.remove('hl'); void row.offsetWidth; row.classList.add('hl'); }
  });
  // легенда
  document.getElementById('mapLegend').innerHTML=
    `<span><i class="sw" style="background:#1b2530"></i>${t('terr.water')}</span>
     <span><i class="sw" style="background:#22301e"></i>${t('terr.forest')}</span>
     <span><i class="sw" style="background:#3a3a38"></i>${t('terr.rock')}</span>
     <span><i class="sw" style="background:#2a261c"></i>${t('terr.plain')}</span>`+
    CASTLES.map(c=>`<span><i class="sw" style="background:${CLANS[c.c].color}"></i>${c.nm}</span>`).join('');
}
function renderClans(){

/* ---------- 10. АНИМАЦИИ ПОЯВЛЕНИЯ И СЧЁТЧИКИ ---------- */
let io=null;
function observeReveals(){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    e.target.classList.add('in');
    e.target.querySelectorAll('[data-count]').forEach(countUp);
    e.target.querySelectorAll('.race-bar>span').forEach(s=>{ if(s.dataset.w) s.style.width=Math.min(s.dataset.w,100)+'%'; });
    io.unobserve(e.target);
  }),{threshold:.15});
  document.querySelectorAll('.rev:not(.in)').forEach(el=>io.observe(el));
}
function countUp(el){
  const end=+el.dataset.count, dur=1100, t0=performance.now();
  const step=n=>{ const p=Math.min((n-t0)/dur,1), e=1-Math.pow(1-p,3);
    el.textContent=nf(Math.round(end*e)); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
